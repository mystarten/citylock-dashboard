# Déploiement Render, version gratuite pour test.
# Les valeurs secrètes ne sont PAS ici : Render les demande à la création (sync: false).
# Sans disque : les réglages, sujets, articles et historique sont effacés à chaque redémarrage ou redéploiement.
services:
  - type: web
    name: citylock-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WP_BASE_URL
        value: https://citylock.fr
      - key: SIMULATE
        value: "true"
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: WP_USER
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
