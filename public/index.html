<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14213D">
  <title>CITYLOCK, espace blog et référencement</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- CONNEXION -->
  <div id="login" class="login hidden">
    <div class="login-art">
      <div class="brand big">CITYLOCK<i></i></div>
      <h2>Votre blog, simplement.</h2>
      <p>Préparez des articles, relisez-les, puis envoyez-les sur votre site. Suivez la santé de votre site chaque semaine.</p>
    </div>
    <div class="login-form">
      <form id="login-form" class="login-card">
        <div class="brand dark">CITYLOCK<i></i></div>
        <h1>Connexion</h1>
        <p class="muted">Entrez vos identifiants pour accéder à votre espace.</p>
        <label for="user">Identifiant</label>
        <input id="user" type="text" autocomplete="username" required>
        <label for="pw">Mot de passe</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <label class="check"><input id="remember" type="checkbox" checked><span>Rester connecté sur cet appareil (30 jours)</span></label>
        <p id="login-error" class="form-error hidden" role="alert"></p>
        <button class="btn primary block" type="submit">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- APPLICATION -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brand">CITYLOCK<i></i></div>
      <nav id="nav" aria-label="Navigation"></nav>
      <button id="logout" class="side-out" type="button"></button>
    </aside>
    <div class="content">
      <div id="sim" class="sim hidden">Mode démonstration : rien n'est envoyé sur votre site.</div>
      <div id="toast" class="toast hidden" role="status"></div>
      <main id="main" class="page"></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
